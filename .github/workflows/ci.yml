name: CI & DevSecOps Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-and-imports:
    name: Python Syntax & Imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python Syntax
        run: |
          python -m compileall app core ml web tests

  test-suite:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    needs: [security-audit, syntax-and-imports]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Smoke Checkpoint
        run: |
          python ml/train.py --mode smoke --epochs 1 --device cpu

      - name: Run Pytest Suite
        run: |
          export ROADSENSE_ADMIN_USER=ci_admin
          export ROADSENSE_ADMIN_PASS=ci_test_password_2026!
          export ROADSENSE_SESSION_SECRET=$(python -c "import secrets; print(secrets.token_hex(32))")
          pytest tests/ -v -m "not slow" || pytest tests/ -v
